<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#120c18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moimoipi">
  <title>Moimoipi – Donjons Idle</title>

<body>
  <div id="app">
    <header id="topbar">
      <div id="tb-floor" class="tb-item">Ville</div>
      <div id="tb-gold" class="tb-item gold">0</div>
      <button id="tb-speed" class="pxbtn small" aria-label="Vitesse du jeu">x1</button>
    </header>
    <main id="screens">
      <section id="screen-dungeon" class="screen active">
        <div id="canvas-wrap">
          <canvas id="game"></canvas>
          <div id="banner"></div>
          <div id="idle-overlay" hidden></div>
          <div id="map-actions"></div>
          <div id="boss-bar" hidden><div class="bb-name"></div><div class="bb-bar"><i></i><b></b></div></div>
          <div id="bless-bar"></div>
        </div>
        <div id="party"></div>
        <div id="potion-bar"></div>
        <div id="log"></div>
      </section>
      <section id="screen-team" class="screen"></section>
      <section id="screen-bag" class="screen"></section>
      <section id="screen-town" class="screen"></section>
      <section id="screen-mine" class="screen"></section>
      <section id="screen-settings" class="screen"></section>
      <section id="screen-locked" class="screen"></section>
    </main>
    <nav id="tabs"></nav>
    <div id="modal-root"></div>
    <div id="toasts"></div>
  </div>

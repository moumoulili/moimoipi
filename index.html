<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#120c18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moimoipi">
  <title>Moimoipi – Donjons Idle</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="tb-floor" class="tb-item">Ville</div>
      <div id="tb-gold" class="tb-item gold">0</div>
      <button id="tb-speed" class="pxbtn small" aria-label="Vitesse du jeu">x1</button>
    </header>
    <main id="screens">
      <section id="screen-dungeon" class="screen active">
        <div id="canvas-wrap">
          <canvas id="game"></canvas>
          <div id="banner"></div>
          <div id="idle-overlay" hidden></div>
        </div>
        <div id="party"></div>
        <div id="dungeon-actions"></div>
        <div id="log"></div>
      </section>
      <section id="screen-town" class="screen"></section>
      <section id="screen-settings" class="screen"></section>
      <section id="screen-locked" class="screen"></section>
    </main>
    <nav id="tabs"></nav>
    <div id="modal-root"></div>
    <div id="toasts"></div>
  </div>

  <!-- Noyau -->
  <script src="js/core/namespace.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/bus.js"></script>
  <!-- Données (configuration) -->
  <script src="js/data/balance.js"></script>
  <script src="js/data/elements.js"></script>
  <script src="js/data/classes.js"></script>
  <script src="js/data/monsters.js"></script>
  <script src="js/data/biomes.js"></script>
  <script src="js/data/rooms.js"></script>
  <script src="js/data/names.js"></script>
  <script src="js/data/buildings.js"></script>
  <!-- Rendu pixel art -->
  <script src="js/render/pixelart.js"></script>
  <script src="js/render/sprites.js"></script>
  <script src="js/render/tiles.js"></script>
  <script src="js/render/fx.js"></script>
  <script src="js/render/font.js"></script>
  <script src="js/render/renderer.js"></script>
  <!-- Systèmes de jeu -->
  <script src="js/systems/path.js"></script>
  <script src="js/systems/stats.js"></script>
  <script src="js/systems/heroes.js"></script>
  <script src="js/systems/dungeon.js"></script>
  <script src="js/systems/combat.js"></script>
  <script src="js/systems/town.js"></script>
  <script src="js/systems/run.js"></script>
  <!-- Sauvegarde, interface, boucle -->
  <script src="js/core/save.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/town.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/core/loop.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
